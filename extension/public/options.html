<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X Copilot 设置</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f7f9f9;
      margin: 0;
      padding: 40px 16px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #fff;
      border: 1px solid #e6e9ec;
      border-radius: 16px;
      padding: 28px 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }
    h1 { font-size: 20px; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
      background: linear-gradient(135deg, #1d9bf0 0%, #4d6bfe 100%);
      color: #fff; font-size: 16px; line-height: 30px; text-align: center;
    }
    .sub { color: #8b98a5; font-size: 13px; margin: 0 0 24px; }
    label { display: block; font-size: 13px; font-weight: 700; margin: 16px 0 6px; color: #0f1419; }
    .desc { font-size: 12px; color: #8b98a5; margin: 0 0 6px; line-height: 1.5; }
    input {
      width: 100%;
      border: 1px solid #cfd9de;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }
    input:focus { border-color: #1d9bf0; box-shadow: 0 0 0 3px rgba(29, 155, 240, 0.15); }
    button {
      margin-top: 24px;
      width: 100%;
      border: none;
      border-radius: 9999px;
      padding: 11px 0;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(135deg, #1d9bf0 0%, #4d6bfe 100%);
    }
    .status { text-align: center; font-size: 13px; margin-top: 12px; min-height: 18px; }
    .status.ok { color: #00a06a; }
    .status.err { color: #c0392b; }
    a { color: #1d9bf0; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1><span class="logo">✦</span> X Copilot 设置</h1>
    <p class="sub">Copilot 只填入内容，绝不自动发送。</p>

    <label for="api-key">DeepSeek API Key</label>
    <p class="desc">
      在 <a href="https://platform.deepseek.com/" target="_blank" rel="noreferrer">DeepSeek 开放平台</a> 获取。
      Key 仅保存在本机浏览器存储中，不会上传到任何第三方服务器。
    </p>
    <input id="api-key" type="password" placeholder="sk-..." />

    <label for="model">模型</label>
    <p class="desc">默认 deepseek-flash；可选 deepseek-v4-pro（更强但更贵更慢）。</p>
    <input id="model" type="text" />

    <label for="base-url">API Base URL</label>
    <p class="desc">OpenAI 兼容 endpoint，默认 https://api.deepseek.com/v1。</p>
    <input id="base-url" type="text" />

    <button id="save">保存</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    var DEFAULTS = { baseUrl: 'https://api.deepseek.com/v1', model: 'deepseek-flash', apiKey: '' };
    var KEY = 'llmConfig';

    var $apiKey = document.getElementById('api-key');
    var $model = document.getElementById('model');
    var $baseUrl = document.getElementById('base-url');
    var $status = document.getElementById('status');

    function setStatus(text, ok) {
      $status.textContent = text;
      $status.className = 'status ' + (ok ? 'ok' : 'err');
    }

    chrome.storage.local.get(KEY).then(function (res) {
      var cfg = Object.assign({}, DEFAULTS, res[KEY] || {});
      $apiKey.value = cfg.apiKey || '';
      $model.value = cfg.model || '';
      $baseUrl.value = cfg.baseUrl || '';
    });

    document.getElementById('save').addEventListener('click', function () {
      if (!$apiKey.value.trim()) {
        setStatus('API Key 不能为空。', false);
        return;
      }
      var cfg = { apiKey: $apiKey.value.trim(), model: $model.value.trim() || DEFAULTS.model, baseUrl: $baseUrl.value.trim() || DEFAULTS.baseUrl };
      chrome.storage.local.set({ llmConfig: cfg }).then(function () {
        setStatus('✓ 已保存，配置立即生效。', true);
      }).catch(function () {
        setStatus('保存失败，请重试。', false);
      });
    });
  </script>
</body>
</html>
