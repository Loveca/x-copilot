<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X Copilot 设置</title>
  <style>
    /* X 浅色主题：bg #fff / surface #f7f9f9 / border #eff3f4 / 强边框 #cfd9de
       text #0f1419 / muted #536471 / hint #8b98a5 / 主操作 黑底白字 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #ffffff;
      color: #0f1419;
      margin: 0;
      padding: 40px 16px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #eff3f4;
      border-radius: 16px;
      padding: 28px 32px;
      width: 100%;
      max-width: 480px;
    }
    h1 { font-size: 20px; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
      background: #0f1419;
      color: #ffffff; font-size: 16px; line-height: 30px; text-align: center;
    }
    .sub { color: #536471; font-size: 13px; margin: 0 0 24px; }
    label { display: block; font-size: 13px; font-weight: 700; margin: 16px 0 6px; color: #0f1419; }
    .desc { font-size: 12px; color: #536471; margin: 0 0 6px; line-height: 1.5; }
    input {
      width: 100%;
      background: #ffffff;
      color: #0f1419;
      border: 1px solid #cfd9de;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }
    input:focus { border-color: #0f1419; }
    input::placeholder { color: #8b98a5; }
    button {
      margin-top: 24px;
      width: 100%;
      border: none;
      border-radius: 9999px;
      padding: 11px 0;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      background: #0f1419;
      transition: background 0.15s ease;
    }
    button:hover { background: #272c30; }
    .status { text-align: center; font-size: 13px; margin-top: 12px; min-height: 18px; }
    .status.ok { color: #0f1419; }
    .status.err { color: #f4212e; }
    a { color: #0f1419; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1><span class="logo">✦</span> X Copilot 设置</h1>
    <p class="sub">Copilot 只填入内容，绝不自动发送。</p>

    <label for="api-key">DeepSeek API Key</label>
    <p class="desc">
      在 <a href="https://platform.deepseek.com/" target="_blank" rel="noreferrer">DeepSeek 开放平台</a> 获取。
      Key 仅保存在本机浏览器存储中，不会上传到任何第三方服务器。
    </p>
    <input id="api-key" type="password" placeholder="sk-..." />

    <label for="model">模型</label>
    <p class="desc">默认 deepseek-flash；可选 deepseek-v4-pro（更强但更贵更慢）。</p>
    <input id="model" type="text" />

    <label for="base-url">API Base URL</label>
    <p class="desc">OpenAI 兼容 endpoint，默认 https://api.deepseek.com/v1。</p>
    <input id="base-url" type="text" />

    <button id="save">保存</button>
    <div id="status" class="status"></div>
  </div>

  <!-- MV3 CSP 禁止内联 script，脚本必须放外部文件 -->
  <script src="options.js"></script>
</body>
</html>
